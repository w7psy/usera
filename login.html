<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - UsEra</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.12), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(109, 40, 217, 0.10), transparent 30%),
                #f7f9fc;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
            border: 1px solid #e8edf5;
        }

        .auth-logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }

        .auth-logo span {
            background: linear-gradient(90deg, #2563eb, #6d28d9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #172033;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #dbe2ec;
            border-radius: 11px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #4f7cff;
            box-shadow: 0 0 0 4px rgba(79, 124, 255, 0.10);
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-button:hover {
            transform: translateY(-1px);
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }

        .auth-switch {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .auth-switch a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <span>UsEra</span>
            </div>

            <h1>Welcome Back 👋</h1>

            <p class="auth-subtitle">
                Login to continue to your university assistant.
            </p>

            <form onsubmit="loginUser(event)">

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button class="auth-button" type="submit">
                    Login →
                </button>

            </form>

            <div id="loginMessage" class="auth-message"></div>

            <div class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </div>

            <a href="index.html" class="back-home">
                ← Back to UsEra
            </a>

        </div>

    </main>


    <script>

        function loginUser(event) {

            event.preventDefault();

            const email =
                document.getElementById("loginEmail").value;

            const password =
                document.getElementById("loginPassword").value;

            const message =
                document.getElementById("loginMessage");

            /*
             * Temporary frontend login.
             * Real database authentication will be added later.
             */

            const savedUser =
                JSON.parse(localStorage.getItem("user"));

            if (
                savedUser &&
                savedUser.email === email &&
                savedUser.password === password
            ) {

                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("loggedInUser", JSON.stringify(savedUser));

                message.style.color = "#059669";
                message.innerText =
                    "✅ Login successful!";

                setTimeout(function () {
                    window.location.href = "index.html";
                }, 700);

            } else {

                message.style.color = "#dc2626";
                message.innerText =
                    "❌ Email or password is incorrect.";
            }
        }

    </script>

</body>
</html>
